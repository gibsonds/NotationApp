name: Tests

# Run vitest on every push and PR. Catches regressions in the merge
# logic (#89), the chord-token equivalence checks, and any future pure-
# function additions in src/lib/__tests__/. Playwright e2e tests are
# excluded — they live under e2e/ and run on a separate path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # The root vitest config also runs infra/lambda/__tests__, and those
      # tests import the Lambda source (jose, @aws-sdk/lib-dynamodb). Those
      # deps live in infra/package.json, so without this step the suite fails
      # to load them — locally it only passes because infra/node_modules is
      # already on disk.
      - run: npm ci --prefix infra
      - run: npx tsc --noEmit
      - run: npm test
