name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix infra --ignore-scripts
      - run: node scripts/security-audit.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-security-reports
          path: security-audit-*.json
          retention-days: 14
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm ci --prefix infra
      - run: npx vitest run infra/lambda/__tests__ src/lib/__tests__/security-client.test.ts src/lib/__tests__/auth-client.test.ts src/lib/__tests__/songbook-isolation.test.ts
      - run: npm run build --prefix infra
