name: Prepare docs changelog

# After every push to main that touches user-facing code or assets, append a
# changelog entry to docs/CHANGELOG.md so the docs site reflects what shipped.
# Publish the proposed entry for review; do not bypass protected main.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Defensive: if the previous commit was already a changelog bump, skip.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need at least the previous commit so `git diff HEAD~1 HEAD` works.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate changelog entry
        run: node scripts/update-changelog.mjs

      - name: Save proposed changelog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposed-changelog
          path: docs/CHANGELOG.md
          retention-days: 14
